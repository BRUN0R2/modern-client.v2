# Content configuration of Modern-Client.v2 (docs/06-assets-and-resources.md, section 2;
# docs/adr/0015-free-content-and-optional-original-assets.md).
#
# You usually do not need this file: on the first start the game detects a Counter-Strike 1.6
# installation and writes content.toml for you. Edit it by hand only to change the defaults.
#
# Where the game reads it, first match wins:
#   1. --content-config <file> on the command line
#   2. ./content.toml in the working directory (for development; ignored by git)
#   3. %APPDATA%\Modern-Client.v2\content.toml       (Windows)
#      ~/.config/modern-client.v2/content.toml       (Linux)

# classic : original Counter-Strike 1.6 assets from your own installation
# open    : the free community content pack, no Valve assets
# dev     : content generated by code (engine development, CI)
# custom  : the explicit [[custom.source]] list below
profile = "classic"

[goldsrcInstall]
# Folder that contains cstrike/ and valve/, e.g.
#   "C:/Program Files (x86)/Steam/steamapps/common/Half-Life"
#   "~/.local/share/Steam/steamapps/common/Half-Life"
# Empty: detect it in the Steam libraries of this computer.
path = ""

[openContent]
# Folder or .nxpak of the free content pack. Empty: the copy installed with the game.
path = ""

# Only for profile = "custom": sources mounted in this order, highest priority first.
# [[custom.source]]
# kind = "goldsrcInstall"       # goldsrcInstall | openContent | devContent
# path = "D:/Games/Half-Life"
#
# [[custom.source]]
# kind = "openContent"
# path = ""

# Content configuration of Modern-Client.v2 (docs/06-assets-and-resources.md, section 2;
# docs/adr/0015-free-content-and-optional-original-assets.md).
#
# You will usually not need this file: the game finds the Counter-Strike 1.6 installation Steam
# made, and a first-start wizard will write content.toml for you once the menus come. Copy this
# file to content.toml to name an installation Steam did not make, or start next with -basedir.
#
# Where the game reads it, first match wins:
#   1. --content-config <file> on the command line
#   2. ./content.toml in the working directory (for development; ignored by git)
#   3. %APPDATA%\Modern-Client.v2\content.toml       (Windows)
#      ~/.config/modern-client.v2/content.toml       (Linux)

# classic : original Counter-Strike 1.6 assets from your own installation
# The other profiles come with their content: open (the free community content pack, no Valve
# assets, with its [openContent] path), dev (content generated by code, for engine development and
# CI) and custom (an explicit list of sources).
profile = "classic"

[goldsrcInstall]
# The Counter-Strike 1.6 installation: the folder with cstrike/ and valve/, which Steam names
# after Half-Life, the base game of CS 1.6, e.g.
#   "C:/Program Files (x86)/Steam/steamapps/common/Half-Life"
#   "/home/<you>/.local/share/Steam/steamapps/common/Half-Life"
# Empty: detect it in the Steam libraries of this computer. -basedir on the command line comes
# before it.
path = ""

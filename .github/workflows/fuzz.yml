# Nightly fuzzing of the parsers of external data (docs/17-build-and-tools.md, section 7). A crash
# fails the run; its input is kept as an artifact, to join the corpus as a test. A pull request
# that changes the fuzzing itself runs it too, for a minute per target, before it merges.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "tests/fuzz/**"
      - "cmake/triplets/**"
      - "cmake/nxTargets.cmake"
      - "CMakePresets.json"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fuzz:
    name: Windows · MSVC · libFuzzer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Inside the workspace: actions/cache refuses paths with `..`.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\build\vcpkgCache
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install CMake and Ninja
        run: python -m pip install --disable-pip-version-check "cmake>=4.3,<5" "ninja>=1.12"

      - name: Bootstrap vcpkg at the manifest's baseline
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout --quiet (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      # As in ci.yml: main saves what it builds under a new key, and every run restores the newest.
      - name: Restore vcpkg binaries
        id: vcpkgCache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-fuzz-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-windows-fuzz-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-
            vcpkg-windows-fuzz-

      - name: Configure, build and fuzz (10 minutes per target; 1 on pull requests)
        id: build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The developer shell puts Visual Studio's own CMake first; keep the pinned one. It also
          # puts the AddressSanitizer runtime on the PATH.
          $cmakeDirectory = Split-Path (Get-Command cmake).Source
          . ./scripts/devShell.ps1
          $env:PATH = "$cmakeDirectory;$env:PATH"
          $cachedBinaries = (Get-ChildItem $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File).Count
          cmake --preset fuzz-windows-msvc "-DNX_FUZZ_SECONDS=$env:FUZZ_SECONDS"
          "vcpkgBuilt=$((Get-ChildItem $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File).Count -ne $cachedBinaries)" >> $env:GITHUB_OUTPUT
          cmake --build --preset fuzz-windows-msvc
          ctest --preset fuzz-windows-msvc

      - name: Save vcpkg binaries
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.build.outputs.vcpkgBuilt == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkgCache.outputs.cache-primary-key }}

      - name: Keep the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: build/fuzz-windows-msvc/fuzzArtifacts
          if-no-files-found: ignore

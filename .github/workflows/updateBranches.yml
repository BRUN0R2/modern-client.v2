# main merges only pull requests up to date with it, and GitHub offers its merge queue only to
# organizations: this workflow does the queue's work (docs/17, section 8). Whenever main moves, a
# CI run ends or a pull request is set to auto-merge, it brings the oldest pull request set to
# auto-merge that is behind main up to date, one at a time.
name: Update branches

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Runs main's copy of this workflow and checks out main, never the pull request's code.
  pull_request_target:
    types: [auto_merge_enabled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

# One run at a time, so that two runs never update two pull requests at once.
concurrency:
  group: updateBranches
  cancel-in-progress: false

jobs:
  update:
    name: Update the next pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/scripts

      - name: Bring the oldest pull request behind main up to date
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_BRANCHES_TOKEN: ${{ secrets.UPDATE_BRANCHES_TOKEN }}
        run: bash .github/scripts/updateNextBranch.sh

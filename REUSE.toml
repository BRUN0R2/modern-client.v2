# Licensing of every file in the repository (REUSE specification, https://reuse.software).
# Decision and rationale: docs/adr/0010-license.md. License texts: LICENSES/.
# When several annotations match a file, the last one applies.
version = 1

# Engine, game, server, tools, data and build files.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Modern-Client.v2 contributors"
SPDX-License-Identifier = "GPL-3.0-or-later WITH LicenseRef-Rook-Plugin-Exception"

# Rook toolchain (compiler, VM, LSP, CLI) and the plugin SDK (std library, generated .rookd
# declarations): permissive, so plugins and mods can use any license.
[[annotations]]
path = "rook/**"
SPDX-FileCopyrightText = "2026 Modern-Client.v2 contributors"
SPDX-License-Identifier = "MIT"

# Documentation.
[[annotations]]
path = ["docs/**", "README.md", "CONTRIBUTING.md", "SECURITY.md"]
SPDX-FileCopyrightText = "2026 Modern-Client.v2 contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The pinned vcpkg GoogleTest recipe and its dependency fixes.
[[annotations]]
path = "cmake/ports/gtest/**"
precedence = "override"
SPDX-FileCopyrightText = ["Microsoft Corporation", "2007-2008 Google Inc.", "2026 Modern-Client.v2 contributors"]
SPDX-License-Identifier = "MIT AND BSD-3-Clause"

# The pinned vcpkg Recast and Detour recipe, built with its virtual query filter, and its upstream fix.
[[annotations]]
path = "cmake/ports/recastnavigation/**"
precedence = "override"
SPDX-FileCopyrightText = ["Microsoft Corporation", "2009-2010 Mikko Mononen", "2026 Modern-Client.v2 contributors"]
SPDX-License-Identifier = "MIT AND Zlib"

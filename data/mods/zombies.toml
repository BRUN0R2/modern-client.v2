# Example for the native offline test mod (ADR-0028). Copy to the user's
# addons/cstrike/entities/zombies.toml. The model comes from the user's own files;
# no CSO content is distributed. Sequence names must exist in the selected model.
sightRange = 2048.0
fieldOfView = 180.0
memoryLifetime = 6.0
arrivalDistance = 8.0
replanDistance = 24.0
# A far goal that moves less than a quarter of how far it is keeps its way, its end slid to it; where a
# zombie placed a player holds 3 seconds against a vaguer or farther noise of it, as a bot's does.
replanShare = 0.25
shortTermMemory = 3.0
# A zombie that lost sight of the player it chased keeps after it, unless a shot heard within half a
# second was made at least 100 units nearer, as a bot does.
threatRecency = 0.5
threatMargin = 100.0
memoryLimit = 32
perceptionBudget = 8
spawnBatchLimit = 64
spawnRadius = 512.0
spawnSpacing = 64.0

# How a zombie finds itself stuck and gets out, as a bot of data/cstrike/bots.toml does (Condition
# Zero's StuckCheck and Wiggle): stuck below 20 units a second across five samples a tenth of a second
# apart, it moves ahead, back or to a side, jumping now and then, until it is 75 units from where it got
# stuck; stuck 4.5 seconds, it searches another way around where it got stuck, the floor within those
# 75 units twenty times its length, and keeps away from the last place it got stuck at while it chases.
[stuck]
sampleInterval = 0.1
samples = 5
stuckSpeed = 20.0
unstuckDistance = 75.0
wiggle = { shortest = 0.5, longest = 1.5 }
firstJump = 0.5
jumpInterval = { shortest = 1.0, longest = 2.0 }
giveUpTime = 4.5
avoidedCost = 20.0
reroutes = 1

# How far a zombie hears each kind of noise, as a bot of data/cstrike/bots.toml does.
[hearing]
footstep = 1100.0
landing = 1100.0
shot = 2000.0
quietShot = 1000.0
emptyShot = 1100.0
errorShare = 0.2

[body]
id = "testZombie"
model = "models/player/zombi/zombi.mdl"
modelOffset = { x = 0.0, y = 0.0, z = 0.0 }
health = 500.0
speed = 160.0
meleeDamage = 20.0
meleeReach = 64.0
meleeInterval = 1.0
idleSequence = "idle1"
walkSequence = "walk"
attackSequence = "ref_shoot_knife"
deathSequence = "death1"
hitGroups = { generic = 1.0, head = 4.0, chest = 1.0, stomach = 1.25, arm = 1.0, leg = 0.75, shield = 0.0, other = 1.0 }
# The palette entry of its blood (BLOOD_COLOR_RED); leave it out for a body that does not bleed.
bloodColor = 247
# How the attacks that hurt it and leave it alive knock it back: pushed the way each went at 4 units a
# second for each point it dealt, to no faster than 300 across, its walk held back a tenth of a second
# while the push carries it, then at half its speed, back to the whole of it over half a second. Leave
# it out for a body the attacks do not knock back.
knockback = { pushPerDamage = 4.0, mostPushSpeed = 300.0, staggerTime = 0.1, slowShare = 0.5, slowRecovery = 0.5 }
# A step each 56 units it walks on the ground, which the players' step indicator shows; leave it out for a
# body whose steps are not heard.
stride = 56.0

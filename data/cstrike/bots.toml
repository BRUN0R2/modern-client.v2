# How the bots see, remember, move and keep their number (docs/10, section 11), read into
# cs::BotRules. ReGameDLL_CS's reconstruction of Condition Zero's bot gives what it has (GPL,
# consulted: docs/20 section 3); the rest is the project's own.

# FInViewCone of a player: m_flFieldOfView 0.5, the cosine of half of a 120 degree cone about its view.
fieldOfView = 120.0
# How many players a bot looks at in a tick, in turn: every player of a game of 32 (the project's).
perceptionBudget = 32
# How long a bot remembers an enemy it no longer sees, and how many it remembers (the project's).
memoryLifetime = 10.0
memoryLimit = 32
# A bot fires at an enemy it sees as far as a shot goes (FireBullets3's 8192 units).
attackDistance = 8192.0
# How near the end of its way a bot arrives, and how far a goal moves before it finds another way
# (the project's, as the zombies' of data/mods/zombies.toml).
arrivalDistance = 8.0
replanDistance = 24.0
# How far from a bot the next place its hunt goes to is drawn on the mesh (the project's: a map's).
huntRadius = 4096.0
# How often bot_quota is looked at (MonitorBotCVars: 0.3 seconds).
quotaInterval = 0.3

# The spots of a player a bot looks for from its origin (CCSBot::IsVisible): its head 25 above, its
# feet 34 below standing and 14 ducked, and its sides 13 across.
[spots]
head = 25.0
standingFeet = 34.0
duckedFeet = 14.0
side = 13.0

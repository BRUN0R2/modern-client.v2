# How a bot's view turns towards where it looks (UpdateLookAngles): a spring, stiffer as it attacks;
# its yaw set once a degree off at most, its pitch pulled twice as hard and held within 89 degrees.
[look]
snapTolerance = 1.0
pitchStiffness = 2.0
pitchLimit = 89.0

[look.attacking]
stiffness = 300.0
damping = 30.0
maxAcceleration = 3000.0

[look.roaming]
stiffness = 200.0
damping = 25.0
maxAcceleration = 3000.0

# How a bot's aim errs (SetAimOffset, UpdateAimOffset): a tenth of the range at most on each axis,
# times the share of skill it lacks; focusing, held steadier than 100 degrees a second, it gains up
# to 0.75 of skill over 5 seconds times the share it lacks, 2 at least; a new error each 0.25 to 1
# second, which its aim moves a tenth of the way to each of its 30 commands a second. Above half a
# skill it aims ahead of a moving enemy by 3 of those commands (Upkeep).
[aim]
errorPerRange = 0.1
slowestFocus = 5.0
quickestFocus = 2.0
bestFocus = 0.75
steadyTurn = 100.0
soonestNewError = 0.25
latestNewError = 1.0
settleShare = 0.1
settleRate = 30.0
leadingSkill = 0.5
leadTime = 0.1

# How a bot fires (FireWeaponAtEnemy): a press weighed at each full think, a tenth of a second apart
# (g_flBotFullThinkInterval), held until the next; aimed within twice HalfHumanWidth beside where it
# aims; with a pistol as fast as it may above 0.75 of skill, else 0.15 to 0.4 seconds apart; with a
# gun at once below half a skill or nearer than 400, 0.3 to 0.7 seconds apart beyond 800, else 0.15 to
# 0.5.
[fire]
aimHalfWidth = 32.0
thinkInterval = 0.1
rapidPistolSkill = 0.75
spraySkill = 0.5
sprayRange = 400.0
distantRange = 800.0

[fire.pistolPause]
shortest = 0.15
longest = 0.4

[fire.distantPause]
shortest = 0.3
longest = 0.7

[fire.burstPause]
shortest = 0.15
longest = 0.5

# How a bot hurt by an enemy looks about (CCSBot::TakeDamage, Panic): unless it sees an enemy as it
# attacks, or else at random, half the square of how much skill it lacks, it looks at a spot about it.
# From half a skill, on the side the attack came from: 100 units that way, ahead, behind or either way
# across of where it looks, and up to 75 the other way; below half, 200 behind and up to 400 to a side.
# Up to 50 up or down, until its view is within 5 degrees of it (SetLookAt's angle tolerance).
[panic]
skilledFrom = 0.5
chance = 0.5
near = 100.0
shift = 75.0
far = 200.0
farSide = 400.0
height = 50.0
lookedWithin = 5.0

# How a bot moves as it fights (AttackState::OnEnter and OnUpdate): as a fight begins, but with a knife,
# it crouches and holds at half a chance with its enemy farther than 750 units, else at 20 percent of how
# much aggression it lacks, a line from its origin 20 lower clear to its enemy's eye; and holding, it
# neither dodges nor keeps its range. Else it dodges a fight at 80 percent of its skill, twice that with a
# knife. Dodging, while its enemy within 2000 units faces it
# (IsPlayerFacingMe), it holds still or slides left or right, a way other than the last drawn each 0.3 to
# 1 second; the first of a fight a jump at a third, above half a skill, moving faster than 10 units a
# second (IsNotMoving). Below 0.66 of skill it keeps its combat range, drawn within 325 to 425 as it
# spawns (ResetValues), 125 either way (hysterisRange), going ahead or back.
[combat]
farCrouchChance = 0.5
crouchFarFrom = 750.0
nearCrouchChance = 0.2
crouchSightDrop = 20.0
dodgeChance = 0.8
knifeDodgeFactor = 2.0
dodgeRange = 2000.0
dodgeTime = { shortest = 0.3, longest = 1.0 }
jumpSkill = 0.5
jumpChance = 0.333
movingSpeed = 10.0
combatRange = { nearest = 325.0, farthest = 425.0 }
rangeSlack = 125.0
rangeSkill = 0.66

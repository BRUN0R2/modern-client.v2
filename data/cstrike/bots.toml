# How the bots see, remember, move, keep their number and play by their skill (docs/10, section 11),
# read into cs::BotRules. ReGameDLL_CS's reconstruction of Condition Zero's bot gives what it has
# (GPL, consulted: docs/20 section 3); the rest is the project's own.

# FInViewCone of a player: m_flFieldOfView 0.5, the cosine of half of a 120 degree cone about its view.
fieldOfView = 120.0
# How many players a bot looks at in a tick, in turn: every player of a game of 32 (the project's).
perceptionBudget = 32
# How long a bot remembers an enemy it no longer sees, and how many it remembers (the project's).
memoryLifetime = 10.0
memoryLimit = 32
# A bot fires at an enemy it sees as far as a shot goes (FireBullets3's 8192 units).
attackDistance = 8192.0
# How near the end of its way a bot arrives, and how far a goal moves before it finds another way: 24
# units, or a quarter of how far it is when that is more, so that a far one that moves a little keeps
# its way, its end slid to it (the project's, as the zombies' of data/mods/zombies.toml).
arrivalDistance = 8.0
replanDistance = 24.0
replanShare = 0.25
# How fast a bot's body loses speed with nothing driving it on, a share of it a second: the ground's
# friction (sv_friction 4), and below 75 units a second as fast as at 75 (sv_stopspeed). A bot slows down
# by it for the end of its way and for a corner, the sharper the more, rather than overshoot them and
# circle back: it cannot turn on the spot.
braking = 4.0
stopSpeed = 75.0
# How fast a walk gains a bot's body speed, a share of the walk a second (sv_accelerate 5): below 75 units
# a second its friction takes 300 a second, so that a walk under 60 gains it nothing; it walks at 120 at
# least, which it gains as fast as friction would stop it from, but to stop where its way ends.
acceleration = 5.0
# How long where a bot placed an enemy holds against an estimate of it less salient, or as salient and
# heard no nearer (OnEvent's short-term memory of a noise, 3 seconds): a step heard does not move where
# it heard a shot, nor a farther step a nearer one, so that its way and its eyes keep still.
shortTermMemory = 3.0
# A bot that lost sight of the enemy it fought keeps after it, unless a shot heard within half a second
# was made at least 100 units nearer than where it last saw it (CanHearNearbyEnemyGunfire).
threatRecency = 0.5
threatMargin = 100.0
# How far from a bot the next place its hunt goes to is drawn on the mesh (the project's: a map's).
huntRadius = 4096.0
# How often bot_quota is looked at (MonitorBotCVars: 0.3 seconds).
quotaInterval = 0.3

# How a bot finds itself stuck and gets out (CCSBot::StuckCheck and Wiggle, cs_bot_nav.cpp): where
# it is sampled each full think, a tenth of a second (g_flBotFullThinkInterval), and it is stuck when
# it went slower than 20 units a second across the last five (MAX_VEL_SAMPLES); stuck, it moves ahead,
# back or to a side drawn each 0.5 to 1.5 seconds, jumping within 0.5 seconds and then each 1 to 2,
# until it is 75 units from where it got stuck. UpdatePathMovement gives its way up 5 seconds after it
# last made some (giveUpDuration): stuck the half second its samples take, then 4.5 more. Then it
# searches another way, on which the floor within those 75 units costs twenty times its length, so
# that it takes any other less than some 2850 units longer (the project's own; the original drops its
# goal at once); stuck once more on its way, it gives up where it goes and hunts another place.
[stuck]
sampleInterval = 0.1
samples = 5
stuckSpeed = 20.0
unstuckDistance = 75.0
wiggle = { shortest = 0.5, longest = 1.5 }
firstJump = 0.5
jumpInterval = { shortest = 1.0, longest = 2.0 }
giveUpTime = 4.5
avoidedCost = 20.0
reroutes = 1

# How far a bot hears an enemy's noise at its sound's full volume (IsGameEventAudible: a step, a hard
# landing and a dry fire 1100 units; a shot 2000, a knife's or a silenced weapon's 1000), its sound's
# volume a share of that (a ducked step nearer: the original's TODO, "use actual volume"), and how far
# off it places it: a fifth of how far it is either way along each axis (OnEvent's 400 at 2000).
[hearing]
footstep = 1100.0
landing = 1100.0
shot = 2000.0
quietShot = 1000.0
emptyShot = 1100.0
errorShare = 0.2

# The spots of a player a bot looks for from its origin (CCSBot::IsVisible): its head 25 above, its
# feet 34 below standing and 14 ducked, and its sides 13 across.
[spots]
head = 25.0
standingFeet = 34.0
duckedFeet = 14.0
side = 13.0


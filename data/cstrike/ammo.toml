# The kinds of ammo of Counter-Strike 1.6 (docs/10, section 7.2), read into cs::AmmoTypes, with
# ReGameDLL_CS's values (GPL, consulted: docs/20 section 3). `id` is the original's name for it,
# which a weapon's `magazine.ammo` names, and `name` what the buy menu shows it as; a player carries
# `maxCarried` rounds of it at most besides
# what its clips hold; buying sells it in boxes of `boxRounds` rounds for `boxPrice` each; the HUD
# shows `picture` beside its rounds, the `ammo` picture of the lists of the original's weapons that
# fire it (sprites/weapon_<name>.txt), read once, here. A round of it goes `penetrationPower` units
# into what it meets to go on, less as what it meets is made of, and through nothing once it went
# `penetrationDistance` (FireBullets3, by the bullet type of the weapons that fire it).
#
# Today: the ammo of the pistols, the submachine guns, the AK-47, the M4A1, the Galil and the M249.

[[ammo]]
id = "9mm"
name = "9 mm"
maxCarried = 120
boxPrice = 20
boxRounds = 30
picture = { sprite = "sprites/640hud7.spr", x = 48, y = 72, width = 24, height = 24 }
penetrationPower = 21 # BULLET_PLAYER_9MM
penetrationDistance = 800.0


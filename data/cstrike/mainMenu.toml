# What the main menu lists (docs/12-ui-hud-and-console.md, section 4), read into cs::MainMenuLook: the
# project's own, as the original's resource/GameMenu.res lists its menu's.
# `font` is what it writes in, of the project's own fonts (data/fonts/): `regular` for its text, `strong` for
# what stands out. `items` are its items from the top: `action`, what the item does (`resumeGame`, `disconnect`,
# `newGame`, `quit`), none twice; and `listed`, when the menu lists it: `always`, or `inGame` for over a map played alone.

font = { regular = "Barlow", strong = "Barlow SemiBold" }

[[items]]
action = "resumeGame"
listed = "inGame"

[[items]]
action = "disconnect"
listed = "inGame"

[[items]]
action = "newGame"
listed = "always"

[[items]]
action = "quit"
listed = "always"

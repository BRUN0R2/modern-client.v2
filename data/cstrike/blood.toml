# The blood a hit sheds on what is behind it (docs/10, section 7.4), read into cs::BloodRules, as
# ReGameDLL_CS's CBaseEntity::TraceBleed and UTIL_BloodDecalTrace shed it (GPL, consulted: docs/20
# section 3): a hit traces its blood along its way and a little off it, 172 units behind where it met
# the body, through the world and the brush entities; one in three of the ways that meet one leaves a
# red blood decal there, each as likely.

decals = ["{blood1", "{blood2", "{blood3", "{blood4", "{blood5", "{blood6"]
reach = 172.0
marksOneIn = 3

# Below 10 damage, one way, a tenth off; below 25, two, a fifth off; above, four, three tenths off.
[[spreads]]
below = 10.0
traces = 1
noise = 0.1

[[spreads]]
below = 25.0
traces = 2
noise = 0.2

[[spreads]]
traces = 4
noise = 0.3

# The blood a hit sprays where it meets the body, as the server tells its clients of it
# (UTIL_BloodDrips, TE_BLOODSPRITE): BLOOD_COLOR_RED, the palette's entry 247; its size the damage's
# whole points, doubled as the multiplayer rules double them, 255 at most, over 10, from 3 to 16.
[spray]
color = 247
amountPerDamage = 2
mostAmount = 255
amountPerSize = 10
smallestSize = 3
largestSize = 16

# How a client shows it, as Xash3D-FWGS's R_BloodSprite does (GPL, consulted): the spray's color the
# entry 1 to 3 after the server's, the drops' the one before that, both 250 of 255 opaque. The spray,
# 2 to 4 units above where the hit met the body, its scale its size over 35 to over 25, plays its
# frames once in a quarter of a second. Its drops, its size and two dice of eight, their scales its size
# over 25 to over 15, fly off at -96 to 95 units a second across the ground and -32 to 95 up, spin
# at -256 to -255 degrees a second, fall at half the world's gravity (FTENT_SLOWGRAVITY), stop where
# they meet the world (FTENT_COLLIDEWORLD) and go after 1 to 3 seconds, each on one of its sprite's
# frames from the second, the last for one beyond the eighth.
[sprayLook]
spraySprite = "sprites/bloodspray.spr"
dropSprite = "sprites/blood.spr"
colorShift = 3
amount = 250
leastLift = 2.0
mostLift = 4.0
leastSprayScale = 0.028571429
mostSprayScale = 0.04
sprayTime = 0.25
extraDropDice = 2
extraDropFaces = 8
leastDropScale = 0.04
mostDropScale = 0.066666667
leastDropSpeed = -96.0
mostDropSpeed = 95.0
leastDropRise = -32.0
mostDropRise = 95.0
leastDropSpin = -256.0
mostDropSpin = -255.0
dropGravity = 0.5
leastDropLife = 1.0
mostDropLife = 3.0
mostDropFrame = 8

# The stream of blood a head without a helmet sheds where the hit met it, the way the hit went, as the
# server tells its clients of it (BloodSplat, TE_BLOODSTREAM): BLOOD_COLOR_DARKRED, the palette's entry
# 223; its speed the head's damage times 5, cut to a whole number, and 0 to 100 more, 255 at most. The
# original writes it as a byte that wraps past 255; ReGameDLL_CS holds it there (UTIL_BloodStream).
[stream]
color = 223
speedPerDamage = 5
mostExtraSpeed = 100
fastest = 255

# How a client shows it, as Xash3D-FWGS's R_BloodStream does (GPL, consulted), each particle of the
# entry 0 to 9 after the server's. Its stream, 100 particles, their way dipped by 0.05 less 0.005 for each
# before (rising after the tenth), the first at the stream's speed and each a unit a second slower, none
# slower than still (GoldSrc keeps their speed a whole number, its decrement of 0.00001 cutting a unit
# each time), falling at 8 twentieths of the world's gravity (pt_8x_slowgrav), gone after 2 seconds.
# Its splash, a particle for each 5 of its speed, their way dipped by 0.075 less 0.005 for each before,
# at a share of its speed drawn from 0 to 1, cut to a whole number, times that share times 1.7, with two
# more each, as fast, dipped a step less and up to a unit off it, as much on each axis; all falling at 4
# twentieths of the world's gravity (pt_4x_slowgrav), gone after 3 seconds.
[streamLook]
colorRange = 10
streamParticles = 100
firstDip = 0.05
dipStep = 0.005
speedStep = 1.0
streamGravity = 0.4
streamLife = 2.0
splashPerSpeed = 5
firstSplashDip = 0.075
splashSpread = 1.7
splashCompanions = 2
companionJitter = 1.0
splashGravity = 0.2
splashLife = 3.0

# How the enhanced look shows the blood a hit sprays (cs.client:bloodEffects), the project's own; the
# legacy look shows the original's above. A spray that bursts from where the hit met the body, a cloud of
# blood smoke with droplets flying out of it, that hangs in the air a moment, a little more of it than a
# real wound sheds, as action games show a hit. At most 2048 droplets and 256 mists at once and 192
# splats, the oldest giving way. Each drop is lit where the hit met the body, 0.45 of its color at least
# so that a hit reads in the dark, a mist 1.35 times as much, as fine blood scatters the light. The air
# slows droplets and mists alike, their speed falling to e^-5 of itself a second, so that the spray stops
# a short way off; a droplet falls at 0.35 of the world's gravity, is drawn along 0.04 seconds of its
# flight, and goes after 0.7 seconds, fading out over the last 0.35, unless it lands first; three tenths
# of those that land on the world leave a splat flat on what they met, 2 to 3.5 times their radius,
# lying 15 seconds and fading out over the last 4.
[enhancedLook]
mostDroplets = 2048
mostSplats = 192
mostMists = 256
streakTime = 0.04
leastLight = 0.45
mistLight = 1.35
mistFadeFrom = 0.5
gravity = 0.35
drag = 5.0
dropletLife = 0.7
dropletFade = 0.35
splatShare = 0.3
leastSplatGrowth = 2.0
mostSplatGrowth = 3.5
splatLife = 15.0
splatFade = 4.0

# A hit elsewhere than the head: 4 droplets for each of the spray's size (from 3 to 16), 0.25 to 0.75
# units across each way, flying off the way the hit went at 120 to 420 units a second, two fifths of
# them back the way it came, each up to 0.7 of its speed off that way and up to 30 faster upward; and a
# splash of 4 mists of 10 to 14 units bursting out of it, wider to the sides (up to 1.2 of their speed
# off that way) at 100 to 150 units a second, from 0.15 of their size opening out to the whole of it,
# 0.8 opaque, fading out from halfway and gone in 0.42 seconds. No gush.
[enhancedLook.body]
dropletsPerSize = 4.0
leastRadius = 0.25
mostRadius = 0.75
leastSpeed = 120.0
mostSpeed = 420.0
spread = 0.7
backShare = 0.4
rise = 30.0
mists = 4
leastMistRadius = 10.0
mostMistRadius = 14.0
mistSpread = 1.2
leastMistSpeed = 100.0
mostMistSpeed = 150.0
mistStartScale = 0.15
mistOpacity = 0.8
mistLife = 0.42
gushPulses = 0
gushDroplets = 0
gushMists = 0
gushInterval = 0.0
gushSlowing = 1.0

# A hit in the head gushes more: 6 droplets for each of the spray's size, 0.3 to 0.9 units, at 160 to
# 520 units a second, two fifths of them back, up to 0.8 of their speed off their way and 50 faster
# upward; a splash of 6 mists of 12 to 18 units at 120 to 190 a second, 0.9 opaque, gone in 0.5 seconds;
# then 8 pulses of 14 droplets and 2 mists each, one every 0.08 seconds, each 0.85 as fast as the one
# before, as the wound gushes.
[enhancedLook.head]
dropletsPerSize = 6.0
leastRadius = 0.3
mostRadius = 0.9
leastSpeed = 160.0
mostSpeed = 520.0
spread = 0.8
backShare = 0.4
rise = 50.0
mists = 6
leastMistRadius = 12.0
mostMistRadius = 18.0
mistSpread = 1.2
leastMistSpeed = 120.0
mostMistSpeed = 190.0
mistStartScale = 0.15
mistOpacity = 0.9
mistLife = 0.5
gushPulses = 8
gushDroplets = 14
gushMists = 2
gushInterval = 0.08
gushSlowing = 0.85

# How the steps of the entities' bodies (zombies, monsters: a type with a stride) show around the middle
# of the screen (docs/12-ui-hud-and-console.md, section 3.2), read into cs::StepIndicatorLook and drawn by
# cs.client:stepIndicator while hud_stepindicator is 1: the project's own, nothing of the original's, as
# games show the sounds a player hears. The players' steps are not shown.

# A red mark of footprints, 0.9 opaque at most, 6% of the screen's height across (65 pixels at 1080), on
# a ring 17% of it about the middle (184 pixels), its toes toward the body heard.
color = { red = 255, green = 70, blue = 50 }
opacity = 0.9
ringRadius = 0.17
size = 0.06

# A body within 128 units shows wholly, fading out to none at 1100, as far as a bot hears a step
# (bots.toml's footstep hearing).
nearDistance = 128.0
farDistance = 1100.0

# A step lights the mark over 0.08 seconds; it holds 0.9 and fades out over 0.6, each step popping it a
# quarter larger, back over 0.25.
attack = 0.08
hold = 0.9
release = 0.6
pulseScale = 0.25
pulseTime = 0.25

# At most 12 marks show, the loudest first, none closer to another than 0.8 of their size; 64 bodies kept.
separation = 0.8
mostShown = 12
mostHeard = 64

# The SG552 (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "sg552"
classname = "weapon_sg552"
name = "Krieg 552" # as the original's buy menu shows it
slot = "primary"
position = 10
weight = 25
maxSpeed = 235.0

[purchase]
buyers = "terrorists"
price = 3500
commands = ["sg552", "krieg552"]
menu = { tab = "rifles", key = 4, picture = "gfx/vgui/sg552.tga" }

[magazine]
ammo = "556Nato"
clipSize = 30

[models]
view = "models/v_sg552.mdl"
player = "models/p_sg552.mdl"
playerAnimation = "mp5"
viewHand = "left"

[view] # sequences of models/v_sg552.mdl
drawSequences = [2] # draw
idles = [{ sequence = 0, wait = 20.0, share = 1.0 }] # idle
idlesWhenEmpty = true

[firing]
cycle = 0.0825
reach = 8192.0 # how far its rounds go
damage = 33.0
rangeModifier = 0.955
penetration = 2
isAutomatic = true
idleAfterShot = 2.0
shootSequences = [3, 4, 5]

[firing.accuracy] # bursts: the shots cubed over 220, in whole numbers, plus 0.3, at most 1
initial = 0.2
burst = { divisor = 220, offset = 0.3, maximum = 1.0 }

[firing.spread]
movingAbove = 140.0
air = { base = 0.035, scale = 0.45 }
moving = { base = 0.035, scale = 0.075 }
standing = { base = 0.0, scale = 0.02 }

[firing.recoil.kicks]
moving = { upBase = 1.0, lateralBase = 0.45, upModifier = 0.28, lateralModifier = 0.04, upMax = 4.25, lateralMax = 2.5, directionChange = 7 }
air = { upBase = 1.25, lateralBase = 0.45, upModifier = 0.22, lateralModifier = 0.18, upMax = 6.0, lateralMax = 4.0, directionChange = 5 }
ducked = { upBase = 0.6, lateralBase = 0.35, upModifier = 0.2, lateralModifier = 0.0125, upMax = 3.7, lateralMax = 2.0, directionChange = 10 }
standing = { upBase = 0.625, lateralBase = 0.375, upModifier = 0.25, lateralModifier = 0.0125, upMax = 4.0, lateralMax = 2.25, directionChange = 9 }

[firing.sound]
files = ["weapons/sg552-1.wav", "weapons/sg552-2.wav"]
channel = "weapon"
volume = 1.0
noise = "shot"

[firing.emptySound] # PlayEmptySound
files = ["weapons/dryfire_rifle.wav"]
channel = "weapon"
volume = 0.8
noise = "emptyShot"

[reload]
time = 3.0
sequences = [1] # reload

[zoom] # SecondaryAttack: its sights
fovs = [55]
switchTime = 0.3
maxSpeed = 200.0
cycle = 0.135

[harm] # what its attacks do to the players they hurt (TakeDamage's flRatio, ShouldDoLargeFlinch)
armorRatio = 1.4
largeFlinch = true

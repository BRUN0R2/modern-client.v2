# The UMP45 (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "ump45"
classname = "weapon_ump45"
name = "K&M UMP45" # as the original's buy menu shows it
slot = "primary"
position = 15
weight = 25
maxSpeed = 250.0

[purchase]
buyers = "everyone"
price = 1700
commands = ["ump45"]
menu = { tab = "submachineGuns", key = 3, picture = "gfx/vgui/ump45.tga" }

[magazine]
ammo = "45ACP"
clipSize = 25

[models]
view = "models/v_ump45.mdl"
player = "models/p_ump45.mdl"
playerAnimation = "carbine"
viewHand = "left"

[view] # sequences of models/v_ump45.mdl
drawSequences = [2] # draw
idles = [{ sequence = 0, wait = 20.0, share = 1.0 }] # idle1
idlesWhenEmpty = true

[firing]
cycle = 0.1
reach = 8192.0 # how far its rounds go (FireBullets3)
damage = 30.0 # FireBullets3's iDamage
rangeModifier = 0.82 # its damage times this for each 500 units it went
penetration = 1 # how many things a round may meet
isAutomatic = true
idleAfterShot = 2.0
shootSequences = [3, 4, 5] # shoot1, shoot2, shoot3

[firing.accuracy] # bursts: the shots squared over 210, in whole numbers, plus 0.5, at most 1.0
initial = 0.0
burst = { divisor = 210, offset = 0.5, maximum = 1.0, power = 2 }

[firing.spread] # base plus scale times the accuracy
movingAbove = 0.0
air = { base = 0.0, scale = 0.24 }
moving = { base = 0.0, scale = 0.04 }
standing = { base = 0.0, scale = 0.04 }

[firing.recoil.kicks] # in the air first, then moving
moving = { upBase = 0.55, lateralBase = 0.3, upModifier = 0.225, lateralModifier = 0.03, upMax = 3.5, lateralMax = 2.5, directionChange = 10 }
air = { upBase = 0.125, lateralBase = 0.65, upModifier = 0.55, lateralModifier = 0.0475, upMax = 5.5, lateralMax = 4.0, directionChange = 10 }
ducked = { upBase = 0.25, lateralBase = 0.175, upModifier = 0.125, lateralModifier = 0.02, upMax = 2.25, lateralMax = 1.25, directionChange = 10 }
standing = { upBase = 0.275, lateralBase = 0.2, upModifier = 0.15, lateralModifier = 0.0225, upMax = 2.5, lateralMax = 1.5, directionChange = 10 }
airFirst = true

[firing.sound] # its client event plays one of them: which, and how far it carries, to be measured on the original
files = ["weapons/ump45-1.wav"]
channel = "weapon"
volume = 1.0
noise = "shot"

[firing.emptySound] # PlayEmptySound
files = ["weapons/dryfire_rifle.wav"]
channel = "weapon"
volume = 0.8
noise = "emptyShot"

[reload]
time = 3.5
sequences = [1] # reload

[harm] # what its attacks do to the players they hurt (TakeDamage's flRatio, ShouldDoLargeFlinch)
armorRatio = 1.0
largeFlinch = false

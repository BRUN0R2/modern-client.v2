# The USP .45 (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "usp"
classname = "weapon_usp"
name = "K&M .45 Tactical" # as the original's buy menu shows it
slot = "secondary"
position = 4
weight = 5
maxSpeed = 250.0

[purchase]
buyers = "everyone"
price = 500

[magazine]
ammo = "45ACP"
clipSize = 12

[models]
view = "models/v_usp.mdl"
player = "models/p_usp.mdl"
playerAnimation = "onehanded"
viewHand = "left"

[view] # sequences of models/v_usp.mdl, without its silencer
drawSequences = [14] # draw_unsil
idles = [{ sequence = 8, wait = 60.0, share = 1.0 }] # idle_unsil
idlesWhenEmpty = false

[firing] # without its silencer
cycle = 0.15 # semi-automatic: the original's 0.225 less 0.075
reach = 4096.0 # how far its rounds go (FireBullets3)
damage = 34.0 # FireBullets3's iDamage
rangeModifier = 0.79 # its damage times this for each 500 units it went
penetration = 1 # how many things a round may meet
isAutomatic = false
idleAfterShot = 2.0
shootSequences = [9, 10, 11] # shoot1_unsil, shoot2_unsil, shoot3_unsil
lastShotSequence = 12 # shootlast_unsil

[firing.accuracy] # paced: each shot takes (0.3 - the time since the last) x 0.275, within 0.6 and 0.92
initial = 0.92
paced = { threshold = 0.3, rate = 0.275, minimum = 0.6, maximum = 0.92 }

[firing.spread] # scale times 1 less the accuracy
movingAbove = 0.0
air = { base = 0.0, scale = 1.2 }
moving = { base = 0.0, scale = 0.225 }
ducked = { base = 0.0, scale = 0.08 }
standing = { base = 0.0, scale = 0.1 }

[firing.recoil]
punch = 2.0

[firing.sound] # its client event plays one of them, which to be measured on the original
files = ["weapons/usp_unsil-1.wav"]
channel = "weapon"
volume = 1.0

[firing.emptySound] # PlayEmptySound
files = ["weapons/dryfire_pistol.wav"]
channel = "weapon"
volume = 0.8

[reload]
time = 2.7
sequences = [13] # reload_unsil

[alternate] # the silencer
switchTime = 3.0
onSequence = 7 # add_silencer
offSequence = 15 # detach_silencer

[alternate.view]
drawSequences = [6] # draw
idles = [{ sequence = 0, wait = 60.0, share = 1.0 }] # idle
idlesWhenEmpty = false

[alternate.firing]
cycle = 0.15
reach = 4096.0 # how far its rounds go (FireBullets3)
damage = 30.0 # FireBullets3's iDamage with its silencer
rangeModifier = 0.79 # its damage times this for each 500 units it went
penetration = 1 # how many things a round may meet
isAutomatic = false
idleAfterShot = 2.0
shootSequences = [1, 2, 3] # shoot1, shoot2, shoot3
lastShotSequence = 4 # shootlast

[alternate.firing.accuracy]
initial = 0.92
paced = { threshold = 0.3, rate = 0.275, minimum = 0.6, maximum = 0.92 }

[alternate.firing.spread]
movingAbove = 0.0
air = { base = 0.0, scale = 1.3 }
moving = { base = 0.0, scale = 0.25 }
ducked = { base = 0.0, scale = 0.125 }
standing = { base = 0.0, scale = 0.15 }

[alternate.firing.recoil]
punch = 2.0

[alternate.firing.sound] # its client event plays one of them, which to be measured on the original
files = ["weapons/usp1.wav", "weapons/usp2.wav"]
channel = "weapon"
volume = 1.0

[alternate.firing.emptySound] # PlayEmptySound
files = ["weapons/dryfire_pistol.wav"]
channel = "weapon"
volume = 0.8

[alternate.reload]
time = 2.7
sequences = [5] # reload

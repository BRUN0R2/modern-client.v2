# The flashbang (docs/10, section 7.3), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3): its count the rounds of its ammo the player carries.

id = "flashbang"
classname = "weapon_flashbang"
name = "Flashbang"
slot = "grenade"
position = 2
weight = 1
maxSpeed = 250.0

[purchase]
buyers = "everyone"
price = 200
commands = ["flash"]
menu = { tab = "equipment", key = 3, picture = "gfx/vgui/flashbang.tga" }

[magazine] # its count is the rounds of it the player carries
ammo = "Flashbang"
clipSize = 0

[models]
view = "models/v_flashbang.mdl"
player = "models/p_flashbang.mdl"
playerAnimation = "grenade"
viewHand = "left"

[view] # sequences of models/v_flashbang.mdl
drawSequences = [3] # deploy
idles = [{ sequence = 0, wait = 12.5, share = 1.0 }] # idle, 10 to 15 seconds apart
idlesWhenEmpty = true

[throwing] # Explode: RadiusFlash of 4, within 1500
kind = "flash"
fuse = 1.5
model = "models/w_flashbang.mdl"
pinSequence = 1 # pullpin
throwSequence = 2 # throw
gravity = 0.5
friction = 0.8
damage = 4.0
radius = 1500.0
bounceSound = { files = ["weapons/grenade_hit1.wav", "weapons/grenade_hit2.wav", "weapons/grenade_hit3.wav"], channel = "item", volume = 0.25 }
sound = { files = ["weapons/flashbang-1.wav", "weapons/flashbang-2.wav"], channel = "auto", volume = 0.55 }

[harm] # what its attacks do to the players they hurt (TakeDamage's flRatio, ShouldDoLargeFlinch)
armorRatio = 1.0
largeFlinch = false

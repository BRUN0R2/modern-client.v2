# The M4A1 (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "m4a1"
classname = "weapon_m4a1"
slot = "primary"
position = 6
weight = 25
maxSpeed = 230.0

[purchase]
buyers = "counterTerrorists"
price = 3100

[magazine]
ammo = "556Nato"
clipSize = 30

[models]
view = "models/v_m4a1.mdl"
player = "models/p_m4a1.mdl"
playerAnimation = "rifle"
viewHand = "left"

[view] # sequences of models/v_m4a1.mdl, without its silencer
drawSequences = [12] # draw_unsil
idles = [{ sequence = 7, wait = 20.0, share = 1.0 }] # idle_unsil
idlesWhenEmpty = true

[firing] # without its silencer
cycle = 0.0875
isAutomatic = true
idleAfterShot = 1.5
shootSequences = [8, 9, 10] # shoot1_unsil, shoot2_unsil, shoot3_unsil

[firing.accuracy] # bursts: the shots cubed over 220, in whole numbers, plus 0.3, at most 1
initial = 0.2
burst = { divisor = 220, offset = 0.3, maximum = 1.0 }

[firing.spread] # base plus scale times the accuracy
movingAbove = 140.0
air = { base = 0.035, scale = 0.4 }
moving = { base = 0.035, scale = 0.07 }
standing = { base = 0.0, scale = 0.02 }

[firing.recoil.kicks]
moving = { upBase = 1.0, lateralBase = 0.45, upModifier = 0.28, lateralModifier = 0.045, upMax = 3.75, lateralMax = 3.0, directionChange = 7 }
air = { upBase = 1.2, lateralBase = 0.5, upModifier = 0.23, lateralModifier = 0.15, upMax = 5.5, lateralMax = 3.5, directionChange = 6 }
ducked = { upBase = 0.6, lateralBase = 0.3, upModifier = 0.2, lateralModifier = 0.0125, upMax = 3.25, lateralMax = 2.0, directionChange = 7 }
standing = { upBase = 0.65, lateralBase = 0.35, upModifier = 0.25, lateralModifier = 0.015, upMax = 3.5, lateralMax = 2.25, directionChange = 7 }

[reload]
time = 3.05
sequences = [11] # reload_unsil

[alternate] # the silencer
switchTime = 2.0
onSequence = 6 # add_silencer
offSequence = 13 # detach_silencer

[alternate.view]
drawSequences = [5] # draw
idles = [{ sequence = 0, wait = 20.0, share = 1.0 }] # idle
idlesWhenEmpty = true

[alternate.firing]
cycle = 0.0875
isAutomatic = true
idleAfterShot = 1.5
shootSequences = [1, 2, 3] # shoot1, shoot2, shoot3

[alternate.firing.accuracy]
initial = 0.2
burst = { divisor = 220, offset = 0.3, maximum = 1.0 }

[alternate.firing.spread]
movingAbove = 140.0
air = { base = 0.035, scale = 0.4 }
moving = { base = 0.035, scale = 0.07 }
standing = { base = 0.0, scale = 0.025 }

[alternate.firing.recoil.kicks]
moving = { upBase = 1.0, lateralBase = 0.45, upModifier = 0.28, lateralModifier = 0.045, upMax = 3.75, lateralMax = 3.0, directionChange = 7 }
air = { upBase = 1.2, lateralBase = 0.5, upModifier = 0.23, lateralModifier = 0.15, upMax = 5.5, lateralMax = 3.5, directionChange = 6 }
ducked = { upBase = 0.6, lateralBase = 0.3, upModifier = 0.2, lateralModifier = 0.0125, upMax = 3.25, lateralMax = 2.0, directionChange = 7 }
standing = { upBase = 0.65, lateralBase = 0.35, upModifier = 0.25, lateralModifier = 0.015, upMax = 3.5, lateralMax = 2.25, directionChange = 7 }

[alternate.reload]
time = 3.05
sequences = [4] # reload

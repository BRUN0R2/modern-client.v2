# The TMP (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "tmp"
classname = "weapon_tmp"
name = "Schmidt Machine Pistol" # as the original's buy menu shows it
slot = "primary"
position = 11
weight = 25
maxSpeed = 250.0

[purchase]
buyers = "counterTerrorists"
price = 1250
commands = ["tmp", "mp"]
menu = { tab = "submachineGuns", key = 1, picture = "gfx/vgui/tmp.tga" }

[magazine]
ammo = "9mm"
clipSize = 30

[models]
view = "models/v_tmp.mdl"
player = "models/p_tmp.mdl"
playerAnimation = "onehanded"
viewHand = "left"

[view] # sequences of models/v_tmp.mdl
drawSequences = [2] # draw
idles = [{ sequence = 0, wait = 20.0, share = 1.0 }] # idle1
idlesWhenEmpty = true

[firing]
cycle = 0.07
reach = 8192.0 # how far its rounds go (FireBullets3)
damage = 20.0 # FireBullets3's iDamage
rangeModifier = 0.85 # its damage times this for each 500 units it went
penetration = 1 # how many things a round may meet
isAutomatic = true
idleAfterShot = 2.0
shootSequences = [3, 4, 5] # shoot, shoot, shoot

[firing.accuracy] # bursts: the shots cubed over 200, in whole numbers, plus 0.55, at most 1.4
initial = 0.2
burst = { divisor = 200, offset = 0.55, maximum = 1.4 }

[firing.spread] # base plus scale times the accuracy
movingAbove = 0.0
air = { base = 0.0, scale = 0.25 }
moving = { base = 0.0, scale = 0.03 }
standing = { base = 0.0, scale = 0.03 }

[firing.recoil.kicks] # in the air first, then moving
moving = { upBase = 0.8, lateralBase = 0.4, upModifier = 0.2, lateralModifier = 0.03, upMax = 3.0, lateralMax = 2.5, directionChange = 7 }
air = { upBase = 1.1, lateralBase = 0.5, upModifier = 0.35, lateralModifier = 0.045, upMax = 4.5, lateralMax = 3.5, directionChange = 6 }
ducked = { upBase = 0.7, lateralBase = 0.35, upModifier = 0.125, lateralModifier = 0.025, upMax = 2.5, lateralMax = 2.0, directionChange = 10 }
standing = { upBase = 0.725, lateralBase = 0.375, upModifier = 0.15, lateralModifier = 0.025, upMax = 2.75, lateralMax = 2.25, directionChange = 9 }
airFirst = true

[firing.sound] # its client event plays one of them: which, and how far it carries, to be measured on the original
files = ["weapons/tmp-1.wav", "weapons/tmp-2.wav"]
channel = "weapon"
volume = 1.0
noise = "shot"

[firing.emptySound] # PlayEmptySound
files = ["weapons/dryfire_rifle.wav"]
channel = "weapon"
volume = 0.8
noise = "emptyShot"

[reload]
time = 2.12
sequences = [1] # reload

[harm] # what its attacks do to the players they hurt (TakeDamage's flRatio, ShouldDoLargeFlinch)
armorRatio = 1.0
largeFlinch = false

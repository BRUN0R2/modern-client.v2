# The MP5 Navy (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "mp5navy"
classname = "weapon_mp5navy"
name = "K&M Sub-Machine Gun" # as the original's buy menu shows it
slot = "primary"
position = 7
weight = 25
maxSpeed = 250.0

[purchase]
buyers = "everyone"
price = 1500
commands = ["mp5", "smg"]
menu = { tab = "submachineGuns", key = 2, picture = "gfx/vgui/mp5.tga" }

[magazine]
ammo = "9mm"
clipSize = 30

[models]
view = "models/v_mp5.mdl"
player = "models/p_mp5.mdl"
playerAnimation = "mp5"
viewHand = "left"

[view] # sequences of models/v_mp5.mdl
drawSequences = [2] # draw
idles = [{ sequence = 0, wait = 20.0, share = 1.0 }] # idle1
idlesWhenEmpty = true

[firing]
cycle = 0.075
reach = 8192.0 # how far its rounds go (FireBullets3)
damage = 26.0 # FireBullets3's iDamage
rangeModifier = 0.84 # its damage times this for each 500 units it went
penetration = 1 # how many things a round may meet
isAutomatic = true
idleAfterShot = 2.0
shootSequences = [3, 4, 5] # shoot1, shoot2, shoot3

[firing.accuracy] # bursts: the shots squared over 220.1, plus 0.45, at most 0.75
initial = 0.0
burst = { divisor = 220.1, offset = 0.45, maximum = 0.75, power = 2 }

[firing.spread] # base plus scale times the accuracy
movingAbove = 0.0
air = { base = 0.0, scale = 0.2 }
moving = { base = 0.0, scale = 0.04 }
standing = { base = 0.0, scale = 0.04 }

[firing.recoil.kicks] # in the air first, then moving
moving = { upBase = 0.5, lateralBase = 0.275, upModifier = 0.2, lateralModifier = 0.03, upMax = 3.0, lateralMax = 2.0, directionChange = 10 }
air = { upBase = 0.9, lateralBase = 0.475, upModifier = 0.35, lateralModifier = 0.0425, upMax = 5.0, lateralMax = 3.0, directionChange = 6 }
ducked = { upBase = 0.225, lateralBase = 0.15, upModifier = 0.1, lateralModifier = 0.015, upMax = 2.0, lateralMax = 1.0, directionChange = 10 }
standing = { upBase = 0.25, lateralBase = 0.175, upModifier = 0.125, lateralModifier = 0.02, upMax = 2.25, lateralMax = 1.25, directionChange = 10 }
airFirst = true

[firing.sound] # its client event plays one of them: which, and how far it carries, to be measured on the original
files = ["weapons/mp5-1.wav", "weapons/mp5-2.wav"]
channel = "weapon"
volume = 1.0
noise = "shot"

[firing.emptySound] # PlayEmptySound
files = ["weapons/dryfire_rifle.wav"]
channel = "weapon"
volume = 0.8
noise = "emptyShot"

[reload]
time = 2.63
sequences = [1] # reload

[harm] # what its attacks do to the players they hurt (TakeDamage's flRatio, ShouldDoLargeFlinch)
armorRatio = 1.0
largeFlinch = false

# The Five-SeveN (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "fiveseven"
classname = "weapon_fiveseven"
name = "ES Five-Seven" # as the original's buy menu shows it
slot = "secondary"
position = 6
weight = 5
maxSpeed = 250.0

[purchase]
buyers = "counterTerrorists"
price = 750
commands = ["fn57", "fiveseven"]
menu = { tab = "pistols", key = 5, picture = "gfx/vgui/fiveseven.tga" }

[magazine]
ammo = "57mm"
clipSize = 20

[models]
view = "models/v_fiveseven.mdl"
player = "models/p_fiveseven.mdl"
playerAnimation = "onehanded"
viewHand = "left"

[view] # sequences of models/v_fiveseven.mdl
drawSequences = [5] # draw
idles = [{ sequence = 0, wait = 3.0625, share = 1.0 }] # idle1
idlesWhenEmpty = false

[firing]
cycle = 0.15 # semi-automatic: the original's 0.2 less 0.05
reach = 4096.0 # how far its rounds go (FireBullets3)
damage = 20.0 # FireBullets3's iDamage
rangeModifier = 0.885 # its damage times this for each 500 units it went
penetration = 1 # how many things a round may meet
isAutomatic = false
idleAfterShot = 2.0
shootSequences = [1, 2] # shoot1, shoot2
lastShotSequence = 3 # shoot_empty

[firing.accuracy] # paced: each shot takes (0.275 - the time since the last) x 0.25, within 0.725 and 0.92
initial = 0.92
paced = { threshold = 0.275, rate = 0.25, minimum = 0.725, maximum = 0.92 }

[firing.spread] # scale times 1 less the accuracy
movingAbove = 0.0
air = { base = 0.0, scale = 1.5 }
moving = { base = 0.0, scale = 0.255 }
ducked = { base = 0.0, scale = 0.075 }
standing = { base = 0.0, scale = 0.15 }

[firing.recoil]
punch = 2.0

[firing.sound] # its client event plays one of them: which, and how far it carries, to be measured on the original
files = ["weapons/fiveseven-1.wav"]
channel = "weapon"
volume = 1.0
noise = "shot"

[firing.emptySound] # PlayEmptySound
files = ["weapons/dryfire_pistol.wav"]
channel = "weapon"
volume = 0.8
noise = "emptyShot"

[reload]
time = 2.7
sequences = [4] # reload

[harm] # what its attacks do to the players they hurt (TakeDamage's flRatio, ShouldDoLargeFlinch)
armorRatio = 1.5
largeFlinch = false

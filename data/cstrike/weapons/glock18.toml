# The Glock 18 (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "glock18"
classname = "weapon_glock18"
slot = "secondary"
position = 2
weight = 5
maxSpeed = 250.0

[purchase]
buyers = "everyone"
price = 400

[magazine]
ammo = "9mm"
clipSize = 20

[models]
view = "models/v_glock18.mdl"
player = "models/p_glock18.mdl"
playerAnimation = "onehanded"
viewHand = "left"

[view] # sequences of models/v_glock18.mdl
drawSequences = [8, 11] # draw, draw2
idles = [
    { sequence = 2, wait = 3.0625, share = 0.3 }, # idle3
    { sequence = 0, wait = 3.75, share = 0.3 },   # idle1
    { sequence = 1, wait = 2.5, share = 0.4 },    # idle2
]
idlesWhenEmpty = false

[firing]
cycle = 0.15 # semi-automatic: the original's 0.2 less 0.05
isAutomatic = false
idleAfterShot = 2.5
shootSequences = [3, 4, 5] # shoot, shoot2, shoot3
lastShotSequence = 6 # shoot_empty

[firing.accuracy] # paced: each shot takes (0.325 - the time since the last) x 0.275, within 0.6 and 0.9
initial = 0.9
paced = { threshold = 0.325, rate = 0.275, minimum = 0.6, maximum = 0.9 }

[firing.spread] # scale times 1 less the accuracy
movingAbove = 0.0
air = { base = 0.0, scale = 1.0 }
moving = { base = 0.0, scale = 0.165 }
ducked = { base = 0.0, scale = 0.075 }
standing = { base = 0.0, scale = 0.1 }

[firing.recoil] # none

[reload]
time = 2.2
sequences = [7, 12] # reload, reload2

[alternate] # the burst: 3 rounds a press, the 2 after the first on the next frames
switchTime = 0.3

[alternate.firing]
cycle = 0.5
isAutomatic = true # in burst, holding the button fires again
idleAfterShot = 2.5
shootSequences = [3, 4, 5]
lastShotSequence = 6
followUps = { rounds = 2, spread = 0.05 }

[alternate.firing.accuracy]
initial = 0.9
paced = { threshold = 0.325, rate = 0.275, minimum = 0.6, maximum = 0.9 }

[alternate.firing.spread]
movingAbove = 0.0
air = { base = 0.0, scale = 1.2 }
moving = { base = 0.0, scale = 0.185 }
ducked = { base = 0.0, scale = 0.095 }
standing = { base = 0.0, scale = 0.3 }

[alternate.firing.recoil] # none

# The Galil (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "galil"
classname = "weapon_galil"
name = "IDF Defender" # as the original's buy menu shows it
slot = "primary"
position = 17
weight = 25
maxSpeed = 240.0

[purchase]
buyers = "terrorists"
price = 2000
commands = ["galil", "defender"]
menu = { tab = "rifles", key = 1, picture = "gfx/vgui/galil.tga" }

[magazine]
ammo = "556Nato"
clipSize = 35

[models]
view = "models/v_galil.mdl"
player = "models/p_galil.mdl"
playerAnimation = "ak47"
viewHand = "left"

[view] # sequences of models/v_galil.mdl
drawSequences = [2] # draw
idles = [{ sequence = 0, wait = 20.0, share = 1.0 }] # idle
idlesWhenEmpty = true

[firing]
cycle = 0.0875
reach = 8192.0 # how far its rounds go (FireBullets3)
damage = 30.0 # FireBullets3's iDamage
rangeModifier = 0.98 # its damage times this for each 500 units it went
penetration = 2 # how many things a round may meet
isAutomatic = true
idleAfterShot = 1.28
shootSequences = [3, 4, 5] # shoot1, shoot2, shoot3

[firing.accuracy] # bursts: the shots cubed over 200, in whole numbers, plus 0.35, at most 1.25
initial = 0.2
burst = { divisor = 200, offset = 0.35, maximum = 1.25 }

[firing.spread] # base plus scale times the accuracy
movingAbove = 140.0
air = { base = 0.04, scale = 0.3 }
moving = { base = 0.04, scale = 0.07 }
standing = { base = 0.0, scale = 0.0375 }

[firing.recoil.kicks]
moving = { upBase = 1.0, lateralBase = 0.45, upModifier = 0.28, lateralModifier = 0.045, upMax = 3.75, lateralMax = 3.0, directionChange = 7 }
air = { upBase = 1.2, lateralBase = 0.5, upModifier = 0.23, lateralModifier = 0.15, upMax = 5.5, lateralMax = 3.5, directionChange = 6 }
ducked = { upBase = 0.6, lateralBase = 0.3, upModifier = 0.2, lateralModifier = 0.0125, upMax = 3.25, lateralMax = 2.0, directionChange = 7 }
standing = { upBase = 0.65, lateralBase = 0.35, upModifier = 0.25, lateralModifier = 0.015, upMax = 3.5, lateralMax = 2.25, directionChange = 7 }

[firing.sound] # its client event plays one of them: which, and how far it carries, to be measured on the original
files = ["weapons/galil-1.wav", "weapons/galil-2.wav"]
channel = "weapon"
volume = 1.0
noise = "shot"

[firing.emptySound] # PlayEmptySound
files = ["weapons/dryfire_rifle.wav"]
channel = "weapon"
volume = 0.8
noise = "emptyShot"

[reload]
time = 2.45
sequences = [1] # reload

[harm] # what its attacks do to the players they hurt (TakeDamage's flRatio, ShouldDoLargeFlinch)
armorRatio = 1.55
largeFlinch = true

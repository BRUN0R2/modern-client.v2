# The SG550 (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3).

id = "sg550"
classname = "weapon_sg550"
name = "Krieg 550 Commando" # as the original's buy menu shows it
slot = "primary"
position = 16
weight = 20
maxSpeed = 210.0

[purchase]
buyers = "counterTerrorists"
price = 4200
commands = ["sg550", "krieg550"]
menu = { tab = "rifles", key = 5, picture = "gfx/vgui/sg550.tga" }

[magazine]
ammo = "556Nato"
clipSize = 30

[models]
view = "models/v_sg550.mdl"
player = "models/p_sg550.mdl"
playerAnimation = "rifle"
viewHand = "left"

[view] # sequences of models/v_sg550.mdl
drawSequences = [4] # draw
idles = [{ sequence = 0, wait = 60.0, share = 1.0 }] # idle
idlesWhenEmpty = false

[firing]
cycle = 0.25
reach = 8192.0 # how far its rounds go
damage = 70.0
rangeModifier = 0.98
penetration = 2
isAutomatic = true
idleAfterShot = 1.8
shootSequences = [1, 2]

[firing.accuracy] # timed: the seconds since the last shot x 0.35, plus 0.65, at most 0.98
initial = 0.9
timed = { rate = 0.35, offset = 0.65, maximum = 0.98 }

[firing.spread]
movingAbove = 0.0
air = { base = 0.0, scale = 0.45 }
moving = { base = 0.15, scale = 0.0 }
ducked = { base = 0.0, scale = 0.04 }
standing = { base = 0.0, scale = 0.05 }

[firing.recoil]
random = { upMinimum = 0.75, upMaximum = 1.25, punchShare = 0.25, lateral = 0.75 }

[firing.sound]
files = ["weapons/sg550-1.wav"]
channel = "weapon"
volume = 1.0
noise = "shot"

[firing.emptySound] # PlayEmptySound
files = ["weapons/dryfire_rifle.wav"]
channel = "weapon"
volume = 0.8
noise = "emptyShot"

[reload]
time = 3.35
sequences = [3] # reload

[zoom] # SecondaryAttack: its sights
fovs = [40, 15]
switchTime = 0.3
maxSpeed = 150.0
sound = { files = ["weapons/zoom.wav"], channel = "item", volume = 0.2 }
unzoomedSpread = { base = 0.025, scale = 0.0 }
hasScope = true

[harm] # what its attacks do to the players they hurt (TakeDamage's flRatio, ShouldDoLargeFlinch)
armorRatio = 1.45
largeFlinch = true

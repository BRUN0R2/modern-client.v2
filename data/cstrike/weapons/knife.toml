# The knife (docs/10, section 7.2), read into cs::Weapon, with ReGameDLL_CS's values (GPL,
# consulted: docs/20 section 3). Every player has one; it is not sold and fires no ammo.

id = "knife"
classname = "weapon_knife"
name = "Knife" # as the original's buy menu shows it
slot = "knife"
position = 1
weight = 0
maxSpeed = 250.0

[models]
view = "models/v_knife.mdl"
player = "models/p_knife.mdl"
playerAnimation = "knife"
viewHand = "right"

[view] # sequences of models/v_knife.mdl
drawSequences = [3] # draw
idles = [{ sequence = 0, wait = 20.0, share = 1.0 }] # idle
idlesWhenEmpty = true
drawSound = { files = ["weapons/knife_deploy1.wav"], channel = "item", volume = 0.3 } # Deploy

[melee.slash] # +attack (Swing): a miss and a hit play the same sequences, in turn
reach = 48.0
# KNIFE_SWING_DAMAGE: its fast swing's 20 is never dealt, the next attack's time set before it is weighed
damage = 15.0
missSequences = [6, 7] # midslash1, midslash2
hitSequences = [6, 7]
miss = { primary = 0.35, secondary = 0.5 }
hit = { primary = 0.4, secondary = 0.5 }
idleAfter = 2.0
missSound = { files = ["weapons/knife_slash1.wav", "weapons/knife_slash2.wav"], channel = "weapon", volume = 1.0, pitch = { least = 94, most = 94 } }
# on the world and the brush entities: the multiplayer rules play no sound of their texture
hitSound = { files = ["weapons/knife_hitwall1.wav"], channel = "item", volume = 1.0, pitch = { least = 98, most = 101 } }
# on a body, a hostage today
bodySound = { files = ["weapons/knife_hit1.wav", "weapons/knife_hit2.wav", "weapons/knife_hit3.wav", "weapons/knife_hit4.wav"], channel = "weapon", volume = 1.0 }

[melee.stab] # +attack2 (Stab): it leaves the idle as it was
reach = 32.0
damage = 65.0 # KNIFE_STAB_DAMAGE; three times as much in a player's back, which comes with the players
missSequences = [5] # stab_miss
hitSequences = [4] # stab
miss = { primary = 1.0, secondary = 1.0 }
hit = { primary = 1.1, secondary = 1.1 }
missSound = { files = ["weapons/knife_slash1.wav", "weapons/knife_slash2.wav"], channel = "weapon", volume = 1.0, pitch = { least = 94, most = 94 } }
# on the world and the brush entities: the multiplayer rules play no sound of their texture
hitSound = { files = ["weapons/knife_hitwall1.wav"], channel = "item", volume = 1.0, pitch = { least = 98, most = 101 } }
# on a body, a hostage today
bodySound = { files = ["weapons/knife_stab.wav"], channel = "weapon", volume = 1.0 }

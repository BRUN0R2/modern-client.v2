# How a player's feet sound (docs/11, section 3), read into cs::FootstepRules, with ReGameDLL_CS's
# sounds and volumes (PM_PlayStepSound, PM_UpdateStepSound, PM_PlayWaterSounds; GPL, consulted:
# docs/20 section 3). Each kind of step (cs::StepKind: a ground's by what its texture is made of in
# sound/materials.txt, a ladder's, and water's) has a sound for each foot, one of its files at random,
# its volume the step's; a `rare` sound plays in place of the foot's one step in `oneIn`; a run of
# `silentEvery` wading steps starts with a silent one. `splash` is going into water or out of it, and
# swimming up.

splash = { files = ["player/pl_wade1.wav", "player/pl_wade2.wav", "player/pl_wade3.wav", "player/pl_wade4.wav"], channel = "body", volume = 1.0 }

[[steps]]
kind = "concrete"
rightFoot = { files = ["player/pl_step1.wav", "player/pl_step3.wav"], channel = "body", volume = 0.5 }
leftFoot = { files = ["player/pl_step2.wav", "player/pl_step4.wav"], channel = "body", volume = 0.5 }

[[steps]]
kind = "metal"
rightFoot = { files = ["player/pl_metal1.wav", "player/pl_metal3.wav"], channel = "body", volume = 0.5 }
leftFoot = { files = ["player/pl_metal2.wav", "player/pl_metal4.wav"], channel = "body", volume = 0.5 }

[[steps]]
kind = "dirt"
rightFoot = { files = ["player/pl_dirt1.wav", "player/pl_dirt3.wav"], channel = "body", volume = 0.55 }
leftFoot = { files = ["player/pl_dirt2.wav", "player/pl_dirt4.wav"], channel = "body", volume = 0.55 }

[[steps]]
kind = "vent"
rightFoot = { files = ["player/pl_duct1.wav", "player/pl_duct3.wav"], channel = "body", volume = 0.7 }
leftFoot = { files = ["player/pl_duct2.wav", "player/pl_duct4.wav"], channel = "body", volume = 0.7 }

[[steps]]
kind = "grate"
rightFoot = { files = ["player/pl_grate1.wav", "player/pl_grate3.wav"], channel = "body", volume = 0.5 }
leftFoot = { files = ["player/pl_grate2.wav", "player/pl_grate4.wav"], channel = "body", volume = 0.5 }

[[steps]]
kind = "tile"
rightFoot = { files = ["player/pl_tile1.wav", "player/pl_tile3.wav"], channel = "body", volume = 0.5 }
leftFoot = { files = ["player/pl_tile2.wav", "player/pl_tile4.wav"], channel = "body", volume = 0.5 }
rare = { sound = { files = ["player/pl_tile5.wav"], channel = "body", volume = 0.5 }, oneIn = 5 }

[[steps]]
kind = "slosh"
rightFoot = { files = ["player/pl_slosh1.wav", "player/pl_slosh3.wav"], channel = "body", volume = 0.5 }
leftFoot = { files = ["player/pl_slosh2.wav", "player/pl_slosh4.wav"], channel = "body", volume = 0.5 }

[[steps]]
kind = "wade"
rightFoot = { files = ["player/pl_wade1.wav", "player/pl_wade2.wav"], channel = "body", volume = 0.65 }
leftFoot = { files = ["player/pl_wade3.wav", "player/pl_wade4.wav"], channel = "body", volume = 0.65 }
silentEvery = 4

[[steps]]
kind = "ladder"
rightFoot = { files = ["player/pl_ladder1.wav", "player/pl_ladder3.wav"], channel = "body", volume = 0.35 }
leftFoot = { files = ["player/pl_ladder2.wav", "player/pl_ladder4.wav"], channel = "body", volume = 0.35 }

[[steps]]
kind = "snow"
rightFoot = { files = ["player/pl_snow1.wav", "player/pl_snow3.wav"], channel = "body", volume = 0.5 }
leftFoot = { files = ["player/pl_snow2.wav", "player/pl_snow4.wav"], channel = "body", volume = 0.5 }
